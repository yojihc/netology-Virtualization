apiVersion: v1
kind: Service
metadata:
  name: app-clusterip-service
spec:
  type: ClusterIP
  selector:
    app: multi-container
  ports:
    - name: nginx-internal
      protocol: TCP
      port: 9001
      targetPort: nginx-port
    - name: multitool-internal
      protocol: TCP
      port: 9002
      targetPort: multi-port
